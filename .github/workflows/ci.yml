name: CI

# Runs the test suite on the same Node major the app targets (package.json
# engines), on Linux, Windows and macOS: the maintainer works on Windows, where
# most recurring bugs are path and line-ending bugs Linux never shows, and
# many video editors work on Macs.
# `npm test` runs vitest inside the repo guard (scripts/test.mjs): it fails if
# any test changes the checkout or the suite takes over its time budget. The
# budget is 60 s on a person's machine, where the suite takes about 20 s. Here
# it is 180 s: a hosted Windows runner has taken over 80 s on runs where every
# test passed, and failed the job for that alone.
# The tests themselves use no network. Before them, `npm run tools:fetch`
# installs the pinned c2patool, the C2PA library's native binary and the trust
# lists (each checked against its SHA-256), so signing and reading are tested
# for real with throwaway certificates, never certs/.
# No package's install script runs (.npmrc), so the C2PA library's does not
# download its binary unchecked. SKIP_RUST_BUILD=1 is a second stop for the
# same script: told only not to download (SKIP_BINARY_DOWNLOAD) on a machine
# with Rust, as GitHub's are, it would try to compile the library from source
# and fail (docs/dependencies.md).
# Branch protection on main requires "test (ubuntu-latest)",
# "test (windows-latest)" and "test (macos-latest)"; renaming the job or the
# matrix changes those names.

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    strategy:
      # One OS failing must not hide whether the other passed.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # Pinned to commits, not tags; Renovate proposes updates (renovate.json5).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24" # must match package.json engines
          cache: npm

      - name: Install (exact versions from package-lock.json)
        run: npm ci
        env:
          SKIP_RUST_BUILD: "1"

      - name: Helper programs and trust lists (pinned, checksummed)
        run: npm run tools:fetch

      - name: Audit dependencies (high+, with the dated allowlist in scripts/audit.mjs)
        run: npm run audit

      - name: Tests
        run: npm test
        env:
          PT_TEST_BUDGET_SECONDS: "180"
          # Fail, not skip, if openssl or a helper program is missing here:
          # otherwise every signing test would skip and the run would pass.
          PT_REQUIRE_TOOLS: "1"

      - name: Client build
        run: npm run build

  # Type check, lint and formatting: the same on every OS, so Linux only.
  # Branch protection on main requires "lint".
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm

      - run: npm ci
        env:
          SKIP_RUST_BUILD: "1"

      - name: Type check (tsc, nothing emitted)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Formatting (Prettier; fix locally with npm run format)
        run: npm run format:check
