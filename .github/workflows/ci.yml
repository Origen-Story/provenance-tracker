name: CI

# Runs the test suite on the same Node major the app targets (package.json
# engines), on Linux and on Windows: the maintainer works on Windows and most
# recurring bugs there are path and line-ending bugs Linux never shows.
# `npm test` runs vitest inside the repo guard (scripts/test.mjs): it fails if
# any test changes the checkout or the suite takes over 60 s.
# Tests are pure: no Postgres, no network, no signing.
# Branch protection on main requires both "test (ubuntu-latest)" and
# "test (windows-latest)"; renaming the job or the matrix changes those names.

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    strategy:
      # One OS failing must not hide whether the other passed.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      # Pinned to commits, not tags; Renovate proposes updates (renovate.json5).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"    # must match package.json engines
          cache: npm

      - name: Install (exact versions from package-lock.json)
        run: npm ci

      - name: Audit dependencies (high+, with the dated allowlist in scripts/audit.mjs)
        run: npm run audit

      - name: Tests
        run: npm test

      - name: Client build
        run: npm run build
