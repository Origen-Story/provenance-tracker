name: Scorecard

# OpenSSF Scorecard: a public checklist of security practice (branch
# protection, pinned dependencies, code review, signed releases and so on).
# Results are published to the public Scorecard service, where anyone can
# look the repository up (the README does not show a badge yet), and uploaded
# to the Security tab. It runs on main only.
# The scorecard action refuses to publish if this workflow gains top-level
# env or defaults, or job-level permissions beyond the ones below.

on:
  push:
    branches: [main]
  branch_protection_rule: {}
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch: {}

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # upload the results to the Security tab
      id-token: write # prove to the Scorecard service that this repo ran it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
