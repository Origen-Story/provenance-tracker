name: Sign-off

# Every commit in a pull request carries a "Signed-off-by:" line (made by
# `git commit -s`): the author states they have the right to contribute the
# change under the project's licence (the Developer Certificate of Origin,
# https://developercertificate.org). Merge commits are skipped; GitHub writes
# them. Branch protection on main requires this check.

on:
  pull_request: {}

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "::error::$(git log -1 --format='%h %s' "$sha") has no Signed-off-by line"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Fix: git rebase --signoff $BASE, then push. Future commits: git commit -s"
            exit 1
          fi
          echo "All commits signed off."
