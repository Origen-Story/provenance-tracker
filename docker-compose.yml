services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: provenance
      POSTGRES_USER: provenance
      POSTGRES_PASSWORD: localdev
    # Published on this machine only. Without the address Docker publishes
    # the port on every network interface, with the password below.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
