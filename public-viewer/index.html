<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Public viewer demo · Provenance Tracker</title>
		<meta
			name="description"
			content="Demo of the provenance tracker's public viewer with a made-up film."
		/>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="./viewer.css" />
		<style>
			html {
				background: #0e0e0e;
			}
			html:has(.ptv[data-theme="light"]) {
				background: #ffffff;
			}
			body {
				margin: 0;
			}
			.demo-note {
				max-width: 72rem;
				margin: 0 auto;
				padding: 0.75rem clamp(1rem, 3vw, 2rem);
				font:
					0.8rem/1.5 system-ui,
					sans-serif;
				color: #8b8b88;
			}
			.demo-note a {
				color: inherit;
			}
		</style>
	</head>
	<body>
		<main id="film"></main>
		<footer class="demo-note">
			<span id="demo-film"
				>Demo with a made-up film; every name, signer and hash is
				invented.</span
			>
			Try <a href="?theme=light">the light theme</a>,
			<code>?youtube=&lt;id&gt;</code>, or a video or an export served from this
			same address: <code>?src=&lt;video file&gt;</code>,
			<code>?export=&lt;export json&gt;</code>.
		</footer>
		<script type="module">
			// A local demo. What the address bar asks for is taken only from this
			// page's own origin, so a link to the demo cannot show someone else's
			// record, video or download under this address.
			import { mountViewer } from "./src/viewer.js";
			import { sameOriginAddress, youtubeIdOf } from "./src/model.js";
			const q = new URLSearchParams(location.search);
			const own = (name) => sameOriginAddress(q.get(name), location.href);
			const refused = ["export", "src", "download"].filter(
				(name) => q.get(name) && !own(name),
			);
			if (q.get("youtube") && !youtubeIdOf(q.get("youtube")))
				refused.push("youtube");
			const note = document.getElementById("demo-film");
			if (refused.length)
				note.textContent = `Left out, because this demo only takes files from its own address: ${refused.join(", ")}. `;
			else if (own("export") || own("src") || q.get("youtube"))
				note.textContent =
					"Showing what the link you followed chose, not the demo film. ";
			mountViewer(document.getElementById("film"), {
				exportUrl: own("export") || "./example/example.provenance.json",
				video: youtubeIdOf(q.get("youtube"))
					? { youtubeId: q.get("youtube") }
					: own("src")
						? { src: own("src") }
						: null,
				download: own("download") ? { url: own("download") } : undefined,
				theme: q.get("theme") === "light" ? "light" : "dark",
				appName: "Origen Story Provenance Tracker",
			});
		</script>
	</body>
</html>
